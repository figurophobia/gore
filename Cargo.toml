[package]
name = "gore"
version = "0.3.0"
edition = "2021"
rust-version = "1.74"
description = "Godot RE toolkit: turn any Godot game (PCK/EXE) into an openable project, with automatic encryption-key recovery."
license = "MIT"
repository = "https://github.com/figurophobia/gore"
homepage = "https://github.com/figurophobia/gore"
keywords = ["godot", "reverse-engineering", "pck", "gdscript", "decompilation"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "gore"
path = "src/lib.rs"

[[bin]]
name = "gore"
path = "src/main.rs"

[dependencies]
aes = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
memmap2 = "0.9"
rayon = "1"
serde_json = "1"
ureq = { version = "2", features = ["tls"] }
zip = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
