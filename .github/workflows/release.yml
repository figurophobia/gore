name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install the cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        if: runner.os != 'Windows'
        working-directory: target/${{ matrix.target }}/release
        run: |
          mkdir -p package
          cp gore package/${{ matrix.archive }}
          tar czf ${{ matrix.archive }}.tar.gz -C package .
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: target/${{ matrix.target }}/release
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item gore.exe "package/${{ matrix.archive }}.exe"
          Compress-Archive -Path package/* -DestinationPath "${{ matrix.archive }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: gore-${{ matrix.archive }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.archive }}.tar.gz
            target/${{ matrix.target }}/release/${{ matrix.archive }}.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          body: |
            ## gore ${{ github.ref_name }}

            Extract any Godot game into an openable Godot project, with automatic
            encryption key recovery.

            Download the archive for your platform, extract it and run `gore`.

            ```bash
            gore recover game.exe -o ./game_project
            ```
